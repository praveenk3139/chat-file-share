<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=/login.html">
  <title>ChatShare - Redirecting</title>
</head>
<body style="background:#090d16; color:#94a3b8; font-family:sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; margin:0;">
  <p>Redirecting to ChatShare...</p>
  <script>
    fetch('/api/me')
      .then(res => {
        if (res.ok) window.location.href = '/dashboard.html';
        else window.location.href = '/login.html';
      })
      .catch(() => {
        window.location.href = '/login.html';
      });
  </script>
</body>
</html>
